apiVersion: v1
kind: Service
metadata:
  name: lgtm-sample-app
  namespace: sample-app
  labels:
    app: lgtm-sample-app
spec:
  type: NodePort
  selector:
    app: lgtm-sample-app
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 32100
    - name: metrics
      port: 9113
      targetPort: 9113
