apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm-sample-app
  namespace: sample-app
  labels:
    app: lgtm-sample-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lgtm-sample-app
  template:
    metadata:
      labels:
        app: lgtm-sample-app
    spec:
      containers:
        - name: web
          image: 905418278789.dkr.ecr.us-east-1.amazonaws.com/lgtm-sample-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          volumeMounts:
            - name: status-conf
              mountPath: /etc/nginx/conf.d/status.conf
              subPath: status.conf
          resources:
            requests: { cpu: 20m, memory: 32Mi }
        - name: exporter
          image: nginx/nginx-prometheus-exporter:1.3.0
          args:
            - --nginx.scrape-uri=http://127.0.0.1:8080/stub_status
          ports:
            - containerPort: 9113
              name: metrics
          resources:
            requests: { cpu: 10m, memory: 16Mi }
      volumes:
        - name: status-conf
          configMap:
            name: sample-app-nginx
